openapi: 3.2.0
info:
  title: Glide Apps Stashes API
  version: ''
servers:
- description: Production
  url: https://api.glideapps.com
security:
- BearerAuth: []
tags:
- name: Stashes
paths:
  /stashes/{stashID}/{serial}:
    put:
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties: {}
                additionalProperties: false
                description: A 200 HTTP response code indicates that the data was successfully stashed into the stash with the given stash ID.
        '400':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      type:
                        type: string
                      message:
                        type: string
                    required:
                    - type
                    - message
                    additionalProperties: false
                required:
                - error
                additionalProperties: false
      parameters:
      - name: stashID
        in: path
        schema:
          type: string
          pattern: ^[a-zA-Z0-9][a-zA-Z0-9_-]{0,255}$
          description: ID of the stash. The stash will be created if it doesn't already exist.
          example: 20240215-job32
        required: true
      - name: serial
        in: path
        schema:
          type: string
          pattern: ^[a-zA-Z0-9][a-zA-Z0-9_-]{0,255}$
          description: 'Serial identifier of the chunk of data to set in the stash. If a chunk has already been sent with the same serial, its data will be overwritten. Chunks will be assembled in the sort order of their serials, so utilize ordered identifiers for each chunk if a specific ordering of data in the stash is desired, e.g., `1`, `2`, etc...

            If the order of data is not important, random, but unique, values can be used, e.g., `c2a4567`.'
          example: '1'
        required: true
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
                additionalProperties: {}
                description: "A row object conforming to the schema of the table, where keys are the column IDs and values are the column values:\n\n```json\n{\n\t\"fullName\": \"Alex Bard\",\n\t\"invoiceDate\": \"2024-07-29T14:04:15.561Z\",\n\t\"totalAmount\": 34.50,\n\t\"amountPaid\": 0\n}\n```"
                example:
                  fullName: Alex Bard
                  invoiceDate: '2024-07-29T14:04:15.561Z'
                  totalAmount: 34.5
                  amountPaid: 0
              description: "A collection of row objects conforming to the schema of the table where keys are the column IDs and values are the column values:\n\n```json\n[\n\t{\n\t\t\"fullName\": \"Alex Bard\",\n\t\t\"invoiceDate\": \"2024-07-29T14:04:15.561Z\",\n\t\t\"totalAmount\": 34.50,\n\t\t\"amountPaid\": 0\n\t},\n\t{\n\t\t\"fullName\": \"Alicia Hines\",\n\t\t\"invoiceDate\": \"2023-06-15T10:30:00.000Z\",\n\t\t\"totalAmount\": 50.75,\n\t\t\"amountPaid\": 20\n\t}\n]\n```"
              example:
              - fullName: Alex Bard
                invoiceDate: '2024-07-29T14:04:15.561Z'
                totalAmount: 34.5
                amountPaid: 0
              - fullName: Alicia Hines
                invoiceDate: '2023-06-15T10:30:00.000Z'
                totalAmount: 50.75
                amountPaid: 20
          text/csv:
            schema:
              type: string
              description: A CSV string. The first line is column IDs, and each subsequent line is a row of data.
              example: 'Name,Age,Birthday

                Alice,25,2024-08-29T09:46:16.722Z

                Bob,30,2020-01-15T09:00:16.722Z'
          text/tab-separated-values:
            schema:
              type: string
              description: A TSV string. The first line is column IDs, and each subsequent line is a row of data.
              example: "Name\tAge\tBirthday\nAlice\t25\t2024-08-29T09:46:16.722Z\nBob\t30\t2020-01-15T09:00:16.722Z"
      description: Sets the content of a chunk of data inside a stash
      tags:
      - Stashes
      summary: Replace stashes by stash id by serial
      x-summary-source: derived
      operationId: putStashesByStashIDBySerial
      x-operation-id-source: derived
  /stashes/{stashID}:
    delete:
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties: {}
                additionalProperties: false
                description: A 200 HTTP response code indicates that the stash with the given stash ID was successfully deleted.
        '400':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      type:
                        type: string
                      message:
                        type: string
                    required:
                    - type
                    - message
                    additionalProperties: false
                required:
                - error
                additionalProperties: false
      parameters:
      - name: stashID
        in: path
        schema:
          type: string
          pattern: ^[a-zA-Z0-9][a-zA-Z0-9_-]{0,255}$
          description: ID of the stash, e.g., `20240215-job32`
          example: 20240215-job32
        required: true
      description: Deletes a stash and all its data
      tags:
      - Stashes
      summary: Delete stashes by stash id
      x-summary-source: derived
      operationId: deleteStashesByStashID
      x-operation-id-source: derived
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: Bearer authentication header of the form Bearer `<token>`, where `<token>` is your [auth token](/api-reference/v2/general/authentication).
x-provenance:
  method: harvested
  publisher: Glide
  source: https://api.glideapps.com/swagger.json
